<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Invoice Generator</title>
    <!-- Tailwind CSS Engine for modern responsive styling -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

    <div class="max-w-2xl mx-auto px-4 py-8">
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-teal-600 tracking-tight">WhatsApp Invoice System</h1>
            <p class="text-gray-500 text-sm mt-1">Generate and transfer digital bills to customers instantly without a server</p>
        </header>

        <!-- The entirely client-side driven interactive invoice form -->
        <form id="invoiceForm" class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 space-y-6">
            
            <!-- Metadata Segment -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Invoice Reference ID</label>
                    <input type="text" id="invoiceNumber" required 
                           class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500 font-mono">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Customer WhatsApp Number</label>
                    <input type="tel" id="customerPhone" placeholder="e.g., 2348031234567" required
                           class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
                </div>
            </div>

            <!-- Client Identification Segment -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-1">Customer / Client Name</label>
                <input type="text" id="customerName" placeholder="John Doe" required
                       class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-500">
            </div>

            <!-- Dynamic Invoice Items Segment -->
            <div>
                <div class="flex items-center justify-between border-b border-gray-100 pb-2 mb-3">
                    <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wide">Line Items</h3>
                    <button type="button" id="addItemBtn" 
                            class="text-xs bg-teal-50 text-teal-600 font-semibold px-3 py-1 rounded-md hover:bg-teal-100 transition-colors">
                        + Add Line Item
                    </button>
                </div>

                <div id="itemsContainer" class="space-y-3">
                    <!-- Standard Default Row -->
                    <div class="item-row grid grid-cols-12 gap-2 items-center bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <div class="col-span-6">
                            <input type="text" placeholder="Item Name/Service" required 
                                   class="item-name w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-teal-500">
                        </div>
                        <div class="col-span-2">
                            <input type="number" placeholder="Qty" min="1" value="1" required 
                                   class="item-qty w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-teal-500 text-center">
                        </div>
                        <div class="col-span-3">
                            <input type="number" placeholder="Price (₦)" step="0.01" required 
                                   class="item-price w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-teal-500">
                        </div>
                        <div class="col-span-1 text-center">
                            <button type="button" class="remove-row-btn text-gray-400 hover:text-red-500 font-bold text-sm">×</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Visual Grand Total Tracker Layout Box -->
            <div class="bg-gray-900 rounded-xl p-4 flex justify-between items-center text-white">
                <span class="text-xs font-medium uppercase tracking-wider text-gray-400">Calculated Invoice Value</span>
                <span class="text-xl font-mono font-bold text-teal-400" id="totalPriceDisplay">₦0.00</span>
            </div>

            <button type="submit" 
                    class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all text-center block text-sm">
                Compile & Dispatch to WhatsApp
            </button>
        </form>
    </div>

    <!-- Frontend Functional JavaScript Layer -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('itemsContainer');
            const addItemBtn = document.getElementById('addItemBtn');
            const totalDisplay = document.getElementById('totalPriceDisplay');
            const invoiceForm = document.getElementById('invoiceForm');

            // Automatically generate a unique Reference ID on load (Format: YYYYMMDDHHMM)
            const now = new Date();
            const timestampID = now.getFullYear() + 
                                String(now.getMonth() + 1).padStart(2, '0') + 
                                String(now.getDate()).padStart(2, '0') + 
                                String(now.getHours()).padStart(2, '0') + 
                                String(now.getMinutes()).padStart(2, '0');
            document.getElementById('invoiceNumber').value = timestampID;

            // Sanitizes input numbers directly on the frontend browser layer
            function cleanPhoneNumber(phoneStr) {
                let cleaned = phoneStr.replace(/\D/g, ''); // Strip everything except digits
                if (cleaned.startsWith('0') && cleaned.length === 11) {
                    cleaned = '234' + cleaned.substring(1); // Translate localized zero prefixes
                }
                return cleaned;
            }

            // Realtime responsive math calculator tracking values across entries
            function calculateInvoiceTotals() {
                let grandTotal = 0;
                const rows = container.querySelectorAll('.item-row');
                
                rows.forEach(row => {
                    const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
                    const price = parseFloat(row.querySelector('.item-price').value) || 0;
                    grandTotal += (qty * price);
                });
                
                totalDisplay.textContent = '₦' + grandTotal.toLocaleString('en-US', { 
                    minimumFractionDigits: 2, 
                    maximumFractionDigits: 2 
                });
            }

            // Append item entry components dynamic loops
            addItemBtn.addEventListener('click', function() {
                const newRow = document.createElement('div');
                newRow.className = "item-row grid grid-cols-12 gap-2 items-center bg-gray-50 p-3 rounded-lg border border-gray-100";
                newRow.innerHTML = `
                    <div class="col-span-6">
                        <input type="text" placeholder="Item Name/Service" required 
                               class="item-name w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                    <div class="col-span-2">
                        <input type="number" placeholder="Qty" min="1" value="1" required 
                               class="item-qty w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-teal-500 text-center">
                    </div>
                    <div class="col-span-3">
                        <input type="number" placeholder="Price (₦)" step="0.01" required 
                               class="item-price w-full bg-white border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                    <div class="col-span-1 text-center">
                        <button type="button" class="remove-row-btn text-gray-400 hover:text-red-500 font-bold text-sm">×</button>
                    </div>
                `;
                container.appendChild(newRow);
                calculateInvoiceTotals();
            });

            // Handle row deletion
            container.addEventListener('click', function(e) {
                if (e.target.classList.contains('remove-row-btn')) {
                    const rowsCount = container.querySelectorAll('.item-row').length;
                    if (rowsCount > 1) {
                        e.target.closest('.item-row').remove();
                        calculateInvoiceTotals();
                    } else {
                        alert('Your invoice requires at least one active item line entry.');
                    }
                }
            });

            // Listen for changes to dynamically calculate prices live
            container.addEventListener('input', calculateInvoiceTotals);

            // Capture submissions and launch direct client-side WhatsApp deep integration redirect loops
            invoiceForm.addEventListener('submit', function(e) {
                e.preventDefault(); // Block standard form reloading
